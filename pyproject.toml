[project]
name = "smartcare-logistics"
version = "0.1.0"
description = "SmartCare Logistics - Enterprise AI Copilot Optimasi Rute Distribusi Obat & Darah Darurat"
readme = "README.md"
authors = [
    { name = "Kelvin Yohanes Putra", email = "kelvinmarpaung088@gmail.com" },
    { name = "Amelia L.Batu" },
    { name = "Nikah Suchia Panjaitan" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastmcp>=4.0.4",
    "google-genai>=2.23.0",
    "gradio>=6.27.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pymupdf>=2.1",
    "pytest>=9.1.1",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
smartcare-logistics = "smartcare_logistics:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
